<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | ModuDesk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html">Modu<span>Desk</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="about.html">About Us</a>
        <a href="contact.html" class="on">Contact Us</a>
        <a href="cart.html">Cart <span class="count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2>Contact us</h2>
      <p class="lead">Questions about a module or an order? Send a message and we will reply within two working days.</p>

      <form id="f">
        <label>Name
          <input name="n" required>
        </label>
        <label>Email
          <input type="email" name="e" required>
        </label>
        <label>Message
          <textarea name="m" rows="5" required></textarea>
        </label>
        <button class="btn" type="submit">Send message</button>
      </form>

      <p class="note" id="ok" role="status"></p>
      <p class="email">Email: hello@modudesk.example</p>
    </section>
  </main>

  <footer>
    <div class="wrap">&copy; 2026 ModuDesk. Build your desk, your way.</div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
